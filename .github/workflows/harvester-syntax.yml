name: Harvester syntax check
on:
  pull_request:
    paths:
      - 'digikala_harvester_1.6.6.py'
      - '.github/workflows/harvester-syntax.yml'
  workflow_dispatch:
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile harvester
        run: python -m py_compile digikala_harvester_1.6.6.py
